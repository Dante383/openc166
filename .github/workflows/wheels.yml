# Builds and tests the Python packages (sdist and wheels) on every push to
# main and every pull request. Every push to main is also released: once CI
# and the packages pass, they go to PyPI and to a GitHub release. See
# docs/releasing.md.
name: Build and release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Work out the version
        id: version
        env:
          EVENT: ${{ github.event_name }}
        # x.y.z from CMakeLists.txt, with z raised by the number of commits
        # since the commit that last changed that version.
        run: |
          base=$(perl -0777 -ne 'print $1 if /project\(openc166\s+VERSION\s+([0-9]+\.[0-9]+\.[0-9]+)/' CMakeLists.txt)
          if [ -z "$base" ]; then
            echo "::error::CMakeLists.txt has no project(openc166 VERSION x.y.z)"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$base"
          since=$(git log -1 --format=%H -G 'VERSION [0-9][0-9]*[.][0-9][0-9]*[.][0-9]' -- CMakeLists.txt)
          count=$(git rev-list --count "$since..HEAD")
          version="$major.$minor.$((patch + count))"
          if [ "$EVENT" = push ] &&
             tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}") &&
             [ "$tagged" != "$(git rev-parse HEAD)" ]; then
            echo "::error::v$version was already released from another commit; raise the version in CMakeLists.txt"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version" >> "$GITHUB_STEP_SUMMARY"

  sdist:
    name: Source package
    needs: version
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set the version
        shell: bash
        run: |
          perl -0777 -pi.orig -e 's/(project\(openc166\s+VERSION\s+)[0-9][0-9.]*/${1}$ENV{VERSION}/' CMakeLists.txt
          rm CMakeLists.txt.orig
          set=$(perl -0777 -ne 'print $1 if /project\(openc166\s+VERSION\s+([0-9.]+)/' CMakeLists.txt)
          if [ "$set" != "$VERSION" ]; then
            echo "::error::Could not set the version in CMakeLists.txt"
            exit 1
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check --strict dist/*
          test -f "dist/openc166-$VERSION.tar.gz"
      - name: Install and test
        env:
          OPENC166_TEST_COMMAND: "1"
        run: |
          python -m pip install dist/*.tar.gz
          python -m unittest discover -s python/tests -v
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  wheels:
    name: Wheels (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        # Linux x86-64 and ARM64 (glibc and musl), Windows x64, x86 and ARM64,
        # macOS Intel and Apple silicon (see [tool.cibuildwheel] in pyproject.toml).
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set the version
        shell: bash
        run: |
          perl -0777 -pi.orig -e 's/(project\(openc166\s+VERSION\s+)[0-9][0-9.]*/${1}$ENV{VERSION}/' CMakeLists.txt
          rm CMakeLists.txt.orig
          set=$(perl -0777 -ne 'print $1 if /project\(openc166\s+VERSION\s+([0-9.]+)/' CMakeLists.txt)
          if [ "$set" != "$VERSION" ]; then
            echo "::error::Could not set the version in CMakeLists.txt"
            exit 1
          fi
      - uses: pypa/cibuildwheel@v4.3.5
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  # The CI workflow (.github/workflows/ci.yml): nothing is released unless it
  # passes.
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [version, sdist, wheels, ci]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/openc166/${{ needs.version.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a failed upload be re-run.
          skip-existing: true

  github-release:
    name: GitHub release
    needs: [version, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        run: |
          tag="v$VERSION"
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          {
            echo "Install it with \`pip install openc166==$VERSION\`."
            echo
            echo "## Changes"
            echo
            git log --no-merges --format='- %s' "${previous:+$previous..}HEAD"
          } > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" dist/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "openc166 $VERSION" --notes-file notes.md
          fi
