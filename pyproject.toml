[build-system]
requires = ["scikit-build-core>=0.11"]
build-backend = "scikit_build_core.build"

[project]
name = "openc166"
dynamic = ["version"]
description = "Keil A166-compatible assembler for the Infineon C166/C167 microcontrollers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
keywords = ["c166", "c167", "st10", "assembler", "keil", "a166", "infineon", "ecu"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Assembly",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Assemblers",
    "Topic :: Software Development :: Embedded Systems",
    "Typing :: Typed",
]

[project.scripts]
openc166-sim = "openc166.sim:main"
openc166-dap = "openc166.dap:main"
openc166-ghidra = "openc166.ghidra:main"

[project.urls]
Homepage = "https://github.com/Dante383/openc166"
Issues = "https://github.com/Dante383/openc166/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.20"
cmake.build-type = "Release"
# The package talks to the library through ctypes, not the Python C API, so
# one wheel per platform serves every Python 3 version.
wheel.py-api = "py3"
wheel.packages = ["python/openc166"]

[tool.scikit-build.cmake.define]
OPENC166_BUILD_TESTS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'project\(openc166\s+VERSION\s+(?P<value>[0-9][0-9.]*)'

# Wheels for PyPI (.github/workflows/wheels.yml). A wheel does not depend on
# the Python version, so cibuildwheel builds it once per platform and then
# tests that same wheel on the oldest and the newest supported Python.
[tool.cibuildwheel]
build = ["cp39-*", "cp314-*"]
test-sources = ["CMakeLists.txt", "examples", "python/tests"]
test-command = "python -m unittest discover -s python/tests -v"
test-environment = { OPENC166_TEST_COMMAND = "1" }

[[tool.cibuildwheel.overrides]]
# The 32-bit ARM image (Ubuntu 20.04, glibc 2.31) has GCC 9, which lacks
# C++20's <span>. Its GCC 10 works and uses the same system libstdc++.
select = "*-manylinux_armv7l"
before-all = "apt-get update && apt-get install -y g++-10"
environment = { CC = "gcc-10", CXX = "g++-10" }

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
# std::filesystem needs macOS 10.15.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }

[tool.cibuildwheel.windows]
# The DLL and the program link the C runtime statically: nothing to bundle.
repair-wheel-command = ""
